<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Vehicle Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: #16181c;
  --surface2: #1e2126;
  --border: #2f3336;
  --border-hover: #3e444c;
  --text: #e7e9ea;
  --muted: #71767b;
  --blue: #1d9bf0;
  --blue-hover: #1a8cd8;
  --green: #00ba7c;
  --red: #f4212e;
  --yellow: #ffd400;
  --r: 16px;
  --r-lg: 20px;
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); color-scheme: dark; }
body {
  font-family: "Noto Sans Myanmar", "Inter", system-ui, -apple-system, sans-serif;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  background: var(--bg);
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
}

/* ===== intro ===== */
#intro {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: grid; place-items: center;
  overflow: hidden;
  animation: introOut .7s cubic-bezier(.7,0,.2,1) 2.1s forwards;
}
#intro::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(500px 320px at 50% 45%, rgba(29,155,240,.18), transparent 70%);
  opacity: 0;
  animation: fadeIn .9s .15s forwards;
}
.stage { position: relative; width: min(420px, 86vw); text-align: center; }
.road {
  position: relative; height: 2px; margin: 0 auto 28px; width: 100%;
  background: var(--border); border-radius: 2px; overflow: hidden;
}
.road::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--blue), transparent);
  transform: translateX(-100%);
  animation: sweep 1.4s .25s ease-in-out forwards;
}
.car-run {
  position: absolute; left: 0; top: -42px; width: 56px; height: 56px;
  transform: translateX(-80px);
  animation: drive 1.5s .15s cubic-bezier(.3,.7,.2,1) forwards;
}
.car-run svg {
  width: 56px; height: 56px;
  filter: drop-shadow(0 0 12px rgba(29,155,240,.7));
}
.intro-title {
  font-family: "Inter", "Noto Sans Myanmar", sans-serif;
  font-weight: 700;
  font-size: clamp(1.5rem, 5.5vw, 2.1rem);
  letter-spacing: -0.02em;
  margin-top: 44px;
}
.intro-title span {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  animation: rise .45s forwards;
}
.intro-sub {
  color: var(--muted);
  font-size: .88rem;
  margin-top: 6px;
  opacity: 0;
  animation: fadeIn .55s 1.35s forwards;
}
@keyframes drive { to { transform: translateX(min(400px, 78vw)); } }
@keyframes sweep { to { transform: translateX(100%); } }
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes introOut {
  to { opacity: 0; visibility: hidden; transform: scale(1.04); }
}

/* ===== layout ===== */
.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px 72px;
}
.reveal {
  opacity: 0;
  transform: translateY(14px);
  animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--blue);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08);
}
.logo svg { width: 22px; height: 22px; }
h1 {
  font-family: "Inter", "Noto Sans Myanmar", sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.sub { font-size: .8rem; color: var(--muted); margin-top: 1px; }

.btn {
  font: inherit;
  color: var(--text);
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  padding: 8px 14px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .88rem;
  font-weight: 500;
  transition: background .15s, border-color .15s, transform .12s;
}
.btn:hover { background: rgba(255,255,255,.06); border-color: var(--border-hover); }
.btn:active { transform: scale(.97); }
.btn svg { width: 15px; height: 15px; }
.btn.on {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.btn.on:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
.spin svg { animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* vehicle status */
.vehicle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  margin-bottom: 14px;
}
.vwrap {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
}
.vicon {
  position: relative;
  width: 52px; height: 52px;
  border-radius: 50%;
  display: grid; place-items: center;
  flex: none;
  background: rgba(29,155,240,.12);
  border: 1px solid rgba(29,155,240,.25);
}
.vicon svg { width: 28px; height: 28px; }
.dot {
  position: absolute;
  top: -2px; right: -2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--surface);
  background: var(--green);
  box-shadow: 0 0 8px rgba(0,186,124,.5);
  transition: background .3s, box-shadow .3s;
}
.dot.red {
  background: var(--red);
  box-shadow: 0 0 8px rgba(244,33,46,.5);
}
.dot.green { animation: pulse 2.2s infinite; }
.dot.grey {
  background: var(--muted);
  box-shadow: none;
}
@keyframes pulse {
  50% { box-shadow: 0 0 0 6px rgba(0,186,124,0); }
  0%  { box-shadow: 0 0 0 0 rgba(0,186,124,.45); }
}
.vtext { flex: 1; min-width: 0; }
.vtext b { display: block; font-size: 1.02rem; font-weight: 600; }
.vtext span { font-size: .84rem; color: var(--muted); }

.tl { flex: 1 1 100%; margin-top: 10px; }
.tlbox { position: relative; padding-top: 14px; }
.mer {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 5px;
  font-family: "Inter", sans-serif;
  font-size: .55rem;
  font-weight: 600;
  letter-spacing: .08em;
  color: var(--muted);
  line-height: 1;
}
.mer b { width: 1px; height: 10px; background: var(--border); }
.bar24 {
  --g: rgba(0,186,124,.45);
  display: flex; gap: 2px; height: 16px;
}
.blk {
  flex: 1; min-width: 0;
  border-radius: 4px;
  background: var(--g);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  animation: blkIn .4s calc(var(--i) * .025s) ease-out both;
}
@keyframes blkIn {
  from { opacity: 0; transform: scaleY(.35); }
}
.ticks {
  position: relative;
  height: 15px;
  margin-top: 5px;
  font-size: .65rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-family: "Inter", sans-serif;
}
.ticks span {
  position: absolute; top: 0;
  transform: translateX(-50%);
}
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }

/* date bar */
.dbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  padding: 10px 12px;
  margin-bottom: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
}
.dbar input[type=date] {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 12px;
  outline: none;
  flex: 1 1 150px;
  min-width: 0;
  color-scheme: dark;
  font-size: .88rem;
}
.dbar input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(29,155,240,.25);
}

/* cards */
.list { display: grid; gap: 10px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  cursor: pointer;
  opacity: 0;
  animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards;
  transition: border-color .15s, background .15s;
}
.card:hover {
  border-color: var(--border-hover);
  background: var(--surface2);
}
.cicon {
  position: relative;
  width: 42px; height: 42px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(29,155,240,.1);
  border: 1px solid rgba(29,155,240,.2);
}
.cicon svg { width: 22px; height: 22px; }
.cicon .dot {
  width: 13px; height: 13px;
  top: -2px; right: -2px;
  border-width: 2px;
}
.who { font-weight: 600; font-size: .98rem; }
.dept { font-size: .8rem; color: var(--muted); margin-top: 1px; }
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 7px;
}
.chip {
  font-size: .74rem;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  color: var(--muted);
}
.chip.warn {
  background: rgba(244,33,46,.12);
  border-color: rgba(244,33,46,.4);
  color: #ff7a84;
}
.badge {
  font-size: .75rem;
  font-weight: 600;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}
.s-ok {
  color: var(--green);
  background: rgba(0,186,124,.1);
  border-color: rgba(0,186,124,.35);
}
.s-wait {
  color: var(--yellow);
  background: rgba(255,212,0,.1);
  border-color: rgba(255,212,0,.3);
}
.s-no {
  color: #ff7a84;
  background: rgba(244,33,46,.1);
  border-color: rgba(244,33,46,.3);
}
.s-na {
  color: var(--muted);
  background: rgba(255,255,255,.04);
  border-color: var(--border);
}

.msg {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 32px 22px;
  text-align: center;
}
.msg h3 { margin-bottom: 6px; font-size: 1.05rem; }
.msg p {
  color: var(--muted);
  max-width: 480px;
  margin: 0 auto 12px;
  font-size: .9rem;
}
.skeleton {
  height: 78px;
  border-radius: var(--r);
  background: linear-gradient(100deg, rgba(255,255,255,.03) 30%, rgba(255,255,255,.07) 50%, rgba(255,255,255,.03) 70%);
  background-size: 200% 100%;
  animation: sh 1.4s infinite;
}
@keyframes sh { to { background-position: -200% 0; } }

.modal {
  position: fixed; inset: 0;
  display: none;
  place-items: center;
  padding: 16px;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(8px);
  z-index: 50;
}
.modal.open { display: grid; }
.sheet {
  width: min(520px, 100%);
  max-height: 84vh;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 22px;
  animation: pop .22s ease-out;
}
@keyframes pop {
  from { transform: translateY(12px) scale(.97); opacity: 0; }
}
.sheet h2 { font-size: 1.15rem; font-weight: 700; }
.rows { margin-top: 14px; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: .9rem;
}
.row span:first-child { color: var(--muted); flex: 0 0 38%; }
.row span:last-child { text-align: right; word-break: break-word; }

footer {
  margin-top: 36px;
  text-align: center;
  font-size: .78rem;
  color: var(--muted);
}
footer a {
  color: var(--blue);
  text-decoration: none;
}
footer a:hover { text-decoration: underline; }

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
@media (max-width: 600px) {
  .card { grid-template-columns: auto 1fr; }
  .card .badge { grid-column: 1 / -1; justify-self: start; margin-top: 2px; }
  .ticks { font-size: .6rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; animation-delay: 0s !important; }
}
</style>
</head>
<body>

<div id="intro" aria-hidden="true">
  <div class="stage">
    <div class="road">
      <div class="car-run">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.4h10a2 2 0 0 1 2 1.4l2 6v4h-3v-2H6v2H3z"/>
          <circle cx="7.5" cy="13" r=".7"/><circle cx="16.5" cy="13" r=".7"/>
        </svg>
      </div>
    </div>
    <div class="intro-title" id="introTitle"></div>
    <div class="intro-sub">ကားတောင်းခံမှု စာရင်း</div>
  </div>
</div>

<div class="wrap">
  <header class="reveal" style="animation-delay:2.4s">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.4h10a2 2 0 0 1 2 1.4l2 6v4h-3v-2H6v2H3z"/>
          <circle cx="7.5" cy="13" r=".6"/><circle cx="16.5" cy="13" r=".6"/>
        </svg>
      </div>
      <div>
        <h1>Office Vehicle Info</h1>
        <div class="sub" id="updated">ကားတောင်းခံမှု စာရင်းများ</div>
      </div>
    </div>
    <button class="btn" id="refresh" aria-label="ပြန်လည်ရယူမည်">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
      </svg>
      ပြန်ယူမည်
    </button>
  </header>

  <section class="vehicle reveal" style="animation-delay:2.55s">
    <div class="vwrap">
      <div class="vicon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.4h10a2 2 0 0 1 2 1.4l2 6v4h-3v-2H6v2H3z"/>
          <circle cx="7.5" cy="13" r=".7"/><circle cx="16.5" cy="13" r=".7"/>
        </svg>
        <span class="dot grey" id="vdot"></span>
      </div>
      <div class="vtext">
        <b>Vehicle 1</b>
        <span id="vstate">စစ်ဆေးနေသည်…</span>
      </div>
      <div class="tl">
        <div class="tlbox">
          <div class="mer"><span>AM</span><b></b><span>PM</span></div>
          <div class="bar24" id="bar"></div>
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="dbar reveal" style="animation-delay:2.7s">
    <button class="btn" id="prev" aria-label="ယခင်ရက်">‹</button>
    <input id="date" type="date" aria-label="ရက်စွဲ ရှာရန်">
    <button class="btn" id="next" aria-label="နောက်ရက်">›</button>
    <button class="btn on" id="today">ယနေ့</button>
    <button class="btn" id="tomorrow">မနက်ဖြန်</button>
    <button class="btn" id="all">အားလုံး</button>
  </div>

  <main class="list" id="list"></main>

  <footer class="reveal" style="animation-delay:2.85s">
    Founder – Oliver Knox · Telegram <a href="https://t.me/oliiverknox" target="_blank" rel="noopener">@oliiverknox</a> · <a href="mailto:vyysxo@gmail.com">Gmail</a>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ====== CONFIG ====== */
const SHEET_ID  = "1cfZ7BHKVWgUuwQXifJWKlblrDLkxrYpzqzAPza1llSA";
const SHEET_TAB = "ခရီးစဉ်တောင်းခံမှုမှတ်တမ်း";
const AUTO_REFRESH_MS = 60000;
/* ==================== */
const $ = s => document.querySelector(s);
const CAR = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.4h10a2 2 0 0 1 2 1.4l2 6v4h-3v-2H6v2H3z"/><circle cx="7.5" cy="13" r=".7"/><circle cx="16.5" cy="13" r=".7"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `\( {d.getFullYear()}- \){pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const addDays = (iso, n) => {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return isoOf(d);
};

/* intro title letters */
(function(){
  const t = "Office Vehicle Info";
  $("#introTitle").innerHTML = [...t].map((c, i) =>
    `<span style="animation-delay:\( {.45 + i * .04}s"> \){c === " " ? "&nbsp;" : c}</span>`
  ).join("");
})();

let rows = [], headers = [], map = {}, selDate = todayISO(), showAll = false;

const PATTERNS = [
  ["date", /အသုံးပြုမည့်ရက်စွဲ|use.*date/i],
  ["created", /created|submitted|timestamp|requested\s*at|ပို့သည့်|^ရက်စွဲ$/i],
  ["status", /သွားမည်|status|state|အခြေအနေ|အတည်ပြု/i],
  ["name", /requester|request(ed)?\s*by|name|staff|employee|user|အမည်|တောင်းခံသူ|တောင်းသူ/i],
  ["dept", /dept|department|division|ဌာန/i],
  ["vehicle", /vehicle|car|plate|ကား/i],
  ["dest", /လမ်းကြောင်း|အကြောင်းအရာ|dest|route|place|location|purpose|ခရီး|နေရာ/i],
  ["female", /^မ\s*\(|female|အမျိုးသမီး/i],
  ["male", /^ကျား|male|အမျိုးသား/i]
];
const TIME_RE = /time|start|end|from|until|အချိန်|နာရီ|ထွက်|ပြန်/i;

function detect() {
  map = { times: [] };
  const used = new Set();
  PATTERNS.forEach(([k, re]) => {
    const i = headers.findIndex((h, i) => !used.has(i) && re.test(h));
    if (i >= 0) { map[k] = i; used.add(i); }
  });
  const pi = headers.findIndex((h, i) => !used.has(i) && /အကြောင်းအရာ|purpose/i.test(h));
  if (pi >= 0) { map.purpose = pi; used.add(pi); }
  headers.forEach((h, i) => {
    if (!used.has(i) && TIME_RE.test(h)) map.times.push(i);
  });
}

const cell = (r, k) => map[k] === undefined ? "" : r.c[map[k]];

function normDate(x) {
  if (!x) return "";
  if (typeof x.v === "string") {
    const m = x.v.match(/^Date\((\d+),(\d+),(\d+)/);
    if (m) return `\( {m[1]}- \){pad(+m[2] + 1)}-${pad(+m[3])}`;
  }
  const f = String(x.f ?? x.v ?? "").trim();
  let m;
  if (m = f.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))
    return `\( {m[1]}- \){pad(m[2])}-${pad(m[3])}`;
  if (m = f.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))
    return `\( {m[3].length === 2 ? "20" + m[3] : m[3]}- \){pad(m[2])}-${pad(m[1])}`;
  const d = new Date(f);
  return isNaN(d) ? "" : isoOf(d);
}

const fmtDate = iso => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `\( {d}. \){m}.${y}`;
};

function mins(x) {
  const out = [];
  const f = String(x.f ?? x.v ?? "");
  const re = /(\d{1,2})[:.](\d{2})\s*([AaPp][Mm]|နံနက်|မနက်|ညနေ|ည|နေ့လယ်|မွန်းလွဲ)?/g;
  let m;
  while (m = re.exec(f)) {
    let h = +m[1];
    const mi = +m[2];
    const ap = (m[3] || "").toLowerCase();
    const isPM = ap === "pm" || /ညနေ|ည|မွန်းလွဲ/.test(ap) || (ap === "နေ့လယ်" && h < 12);
    const isAM = ap === "am" || /နံနက်|မနက်/.test(ap);
    if (isPM && h < 12) h += 12;
    if (isAM && h === 12) h = 0;
    out.push(h * 60 + mi);
  }
  if (!out.length && typeof x.v === "string") {
    const t = x.v.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)/);
    if (t) out.push(+t[1] * 60 + +t[2]);
  }
  return out;
}

function slotOf(r) {
  const all = [];
  map.times.forEach(i => all.push(...mins(r.cells[i])));
  if (!all.length) return null;
  let s = all[0], e = all.length > 1 ? all[1] : s + 60;
  if (e <= s) e = all.length > 1 && all[1] < s ? 1440 : s + 60;
  return [Math.max(0, s), Math.min(1440, e)];
}

const fmt = m => {
  m = ((m % 1440) + 1440) % 1440;
  const h = Math.floor(m / 60);
  return `\( {h % 12 || 12}: \){pad(m % 60)} ${h < 12 ? "AM" : "PM"}`;
};

function statusInfo(s) {
  s = String(s).trim().toLowerCase();
  if (/မသွား|reject|den|declin|cancel|ပယ်|ငြင်း/.test(s))
    return ["s-no", "မသွားဖြစ်ပါ", "no"];
  if (/သွားမည်|approv|accept|confirm|အတည်ပြု|ခွင့်ပြု/.test(s))
    return ["s-ok", "သွားမည်", "ok"];
  if (!s || /pend|wait|new|review|စောင့်|ဆိုင်း/.test(s))
    return ["s-wait", "စောင့်ဆိုင်းဆဲ", "wait"];
  return ["s-na", s, "na"];
}

const isActive = r => statusInfo(cell(r, "status"))[2] !== "no";
