<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Vehicle Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05070a;
  --surface: rgba(22, 26, 34, 0.55);
  --surface2: rgba(30, 36, 48, 0.7);
  --surface-solid: #12161e;
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.16);
  --text: #eef1f5;
  --muted: #8b93a1;
  --blue: #3b9eff;
  --blue-glow: rgba(59, 158, 255, 0.45);
  --blue-soft: rgba(59, 158, 255, 0.12);
  --green: #00d68f;
  --green-glow: rgba(0, 214, 143, 0.4);
  --red: #ff4d5e;
  --red-glow: rgba(255, 77, 94, 0.4);
  --yellow: #ffd60a;
  --r: 18px;
  --r-lg: 24px;
  --glass: blur(18px) saturate(1.4);
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); color-scheme: dark; }
body {
  font-family: "Noto Sans Myanmar", "Inter", system-ui, -apple-system, sans-serif;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(59,158,255,0.18), transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 100%, rgba(0,214,143,0.07), transparent 50%),
    radial-gradient(ellipse 60% 40% at 0% 80%, rgba(59,158,255,0.06), transparent 45%),
    var(--bg);
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  overflow-x: hidden;
}

/* ===== INTRO — cinematic liquid ===== */
#intro {
  position: fixed; inset: 0; z-index: 100;
  background: #020406;
  display: grid; place-items: center;
  overflow: hidden;
  animation: introOut 0.9s cubic-bezier(.65,0,.35,1) 3.1s forwards;
}
#intro::before {
  content: "";
  position: absolute; inset: -20%;
  background:
    radial-gradient(ellipse 50% 40% at 50% 40%, rgba(59,158,255,0.35), transparent 65%),
    radial-gradient(circle at 30% 70%, rgba(0,214,143,0.12), transparent 45%),
    radial-gradient(circle at 75% 25%, rgba(59,158,255,0.1), transparent 40%);
  opacity: 0;
  animation: glowPulse 2.8s 0.05s ease-out forwards;
  filter: blur(2px);
}
#intro::after {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 50%, transparent 25%, rgba(0,0,0,0.7) 100%);
  opacity: 0;
  animation: fadeIn 0.7s 0.15s forwards;
}
.stage {
  position: relative;
  width: min(480px, 90vw);
  text-align: center;
  z-index: 2;
}
.intro-logo {
  width: 84px; height: 84px;
  margin: 0 auto 32px;
  border-radius: 28px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(59,158,255,0.9), rgba(20,90,180,0.95));
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.18),
    0 8px 32px rgba(59,158,255,0.35),
    0 0 60px rgba(59,158,255,0.25),
    inset 0 1px 0 rgba(255,255,255,0.25);
  opacity: 0;
  transform: scale(0.3) rotate(-18deg);
  animation: logoIn 1s cubic-bezier(.2,.9,.25,1.15) 0.12s forwards;
  position: relative;
  overflow: hidden;
}
.intro-logo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
  transform: translateX(-120%);
  animation: logoShine 1.4s 0.9s ease-out forwards;
}
.intro-logo svg {
  width: 42px; height: 42px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
}
.road {
  position: relative;
  height: 4px;
  margin: 0 auto 10px;
  width: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15) 12%, rgba(255,255,255,0.15) 88%, transparent);
  border-radius: 4px;
  overflow: visible;
  opacity: 0;
  animation: roadExpand 1.2s cubic-bezier(.2,.8,.2,1) 0.5s forwards;
}
.road::before {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(59,158,255,0.95), transparent);
  transform: translateY(-50%) scaleX(0);
  transform-origin: left center;
  animation: beam 1.5s 0.65s cubic-bezier(.4,0,.2,1) forwards;
  box-shadow: 0 0 16px rgba(59,158,255,0.7);
}
.road::after {
  content: "";
  position: absolute;
  left: -30%; top: -3px;
  width: 45%; height: 10px;
  background: linear-gradient(90deg, transparent, rgba(59,158,255,0.9), transparent);
  border-radius: 6px;
  filter: blur(3px);
  opacity: 0;
  animation: sweepGlow 1.6s 0.7s ease-in-out forwards;
}
.car-run {
  position: absolute;
  left: 0; top: -42px;
  width: 58px; height: 58px;
  transform: translateX(-80px) scale(0.65);
  opacity: 0;
  animation: drive 1.7s 0.6s cubic-bezier(.25,.7,.12,1) forwards;
}
.car-run svg {
  width: 58px; height: 58px;
  filter: drop-shadow(0 0 16px rgba(59,158,255,0.9)) drop-shadow(0 0 32px rgba(59,158,255,0.4));
}
.intro-title {
  font-family: "Inter", "Noto Sans Myanmar", sans-serif;
  font-weight: 700;
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  letter-spacing: -0.035em;
  margin-top: 40px;
  line-height: 1.15;
  background: linear-gradient(180deg, #fff 30%, rgba(180,210,255,0.85));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.intro-title span {
  display: inline-block;
  opacity: 0;
  transform: translateY(28px) scale(0.9);
  filter: blur(8px);
  animation: letterIn 0.6s cubic-bezier(.2,.85,.2,1) forwards;
}
.intro-sub {
  color: var(--muted);
  font-size: 0.95rem;
  margin-top: 12px;
  opacity: 0;
  letter-spacing: 0.04em;
  transform: translateY(10px);
  animation: subIn 0.65s cubic-bezier(.2,.8,.2,1) 1.7s forwards;
}
.intro-line {
  width: 0;
  height: 2px;
  margin: 20px auto 0;
  background: linear-gradient(90deg, transparent, var(--blue), transparent);
  border-radius: 2px;
  opacity: 0;
  animation: lineGrow 0.75s cubic-bezier(.2,.8,.2,1) 1.85s forwards;
  box-shadow: 0 0 12px var(--blue-glow);
}

@keyframes glowPulse {
  0%   { opacity: 0; transform: scale(0.8); }
  45%  { opacity: 1; transform: scale(1.08); }
  100% { opacity: 0.9; transform: scale(1); }
}
@keyframes logoIn {
  to { opacity: 1; transform: scale(1) rotate(0deg); }
}
@keyframes logoShine {
  to { transform: translateX(140%); }
}
@keyframes roadExpand {
  to { width: 100%; opacity: 1; }
}
@keyframes beam {
  to { transform: translateY(-50%) scaleX(1); }
}
@keyframes sweepGlow {
  0%   { left: -30%; opacity: 0; }
  18%  { opacity: 1; }
  82%  { opacity: 0.75; }
  100% { left: 90%; opacity: 0; }
}
@keyframes drive {
  0%   { transform: translateX(-80px) scale(0.65); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: translateX(min(450px, 85vw)) scale(1); opacity: 1; }
}
@keyframes letterIn {
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes subIn {
  to { opacity: 1; transform: none; }
}
@keyframes lineGrow {
  to { width: 80px; opacity: 1; }
}
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes introOut {
  0%   { opacity: 1; transform: scale(1); filter: blur(0); }
  100% { opacity: 0; visibility: hidden; transform: scale(1.06); filter: blur(6px); }
}

/* ===== layout ===== */
.wrap {
  max-width: 700px;
  margin: 0 auto;
  padding: 22px 16px 80px;
}
.reveal {
  opacity: 0;
  transform: translateY(18px);
  animation: rise 0.7s cubic-bezier(.2,.8,.2,1) forwards;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px;
  border-radius: 16px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--blue), #1a6fd0);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.12),
    0 6px 20px rgba(59,158,255,0.3),
    inset 0 1px 0 rgba(255,255,255,0.2);
}
.logo svg { width: 26px; height: 26px; }
h1 {
  font-family: "Inter", "Noto Sans Myanmar", sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.025em;
}
.sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

.btn {
  font: inherit;
  color: var(--text);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  padding: 9px 16px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.88rem;
  font-weight: 500;
  transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
}
.btn:hover {
  background: var(--surface2);
  border-color: var(--border-hover);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.btn:active { transform: scale(0.96); }
.btn svg { width: 15px; height: 15px; }
.btn.on {
  background: linear-gradient(135deg, var(--blue), #1a7de0);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 18px var(--blue-glow);
}
.btn.on:hover {
  background: linear-gradient(135deg, #4aa8ff, #1a8cf0);
  box-shadow: 0 6px 22px var(--blue-glow);
}
.spin svg { animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ===== vehicle status card — liquid ===== */
.vehicle {
  background: var(--surface);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden;
}
.vehicle::before {
  content: "";
  position: absolute;
  top: -40%;
  right: -20%;
  width: 60%;
  height: 100%;
  background: radial-gradient(circle, var(--blue-soft), transparent 70%);
  pointer-events: none;
}
.vwrap {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  position: relative;
}
.vicon {
  position: relative;
  width: 58px; height: 58px;
  border-radius: 18px;
  display: grid; place-items: center;
  flex: none;
  background: linear-gradient(145deg, rgba(59,158,255,0.2), rgba(59,158,255,0.06));
  border: 1px solid rgba(59,158,255,0.3);
  box-shadow: 0 4px 16px rgba(59,158,255,0.15);
}
.vicon svg { width: 30px; height: 30px; }
.dot {
  position: absolute;
  top: -3px; right: -3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 3px solid var(--surface-solid);
  background: var(--green);
  box-shadow: 0 0 10px var(--green-glow);
  transition: background 0.3s, box-shadow 0.3s;
}
.dot.red {
  background: var(--red);
  box-shadow: 0 0 10px var(--red-glow);
}
.dot.green { animation: pulse 2.4s infinite; }
.dot.grey {
  background: var(--muted);
  box-shadow: none;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(0,214,143,0.5); }
  60%  { box-shadow: 0 0 0 8px rgba(0,214,143,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,214,143,0); }
}
.vtext { flex: 1; min-width: 0; }
.vtext b {
  display: block;
  font-size: 1.08rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.vtext span {
  font-size: 0.86rem;
  color: var(--muted);
  margin-top: 2px;
  display: block;
}

/* ===== Timeline — premium ===== */
.tl { flex: 1 1 100%; margin-top: 14px; }
.tlbox { position: relative; padding-top: 18px; }
.mer {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  font-family: "Inter", sans-serif;
  font-size: 0.6rem;
  font-weight: 650;
  letter-spacing: 0.12em;
  color: var(--muted);
  line-height: 1;
  text-transform: uppercase;
}
.mer b {
  width: 1px; height: 12px;
  background: linear-gradient(to bottom, transparent, var(--border), transparent);
}
.bar24 {
  --g: rgba(0, 214, 143, 0.28);
  display: flex; gap: 3px; height: 22px;
  padding: 3px;
  background: rgba(0,0,0,0.25);
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
}
.blk {
  flex: 1; min-width: 0;
  border-radius: 7px;
  background: var(--g);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  animation: blkIn 0.45s calc(var(--i) * 0.03s) ease-out both;
  transition: transform 0.15s, filter 0.15s;
  position: relative;
}
.blk:hover {
  transform: scaleY(1.12);
  filter: brightness(1.15);
  z-index: 2;
}
@keyframes blkIn {
  from { opacity: 0; transform: scaleY(0.3); }
}
.ticks {
  position: relative;
  height: 18px;
  margin-top: 7px;
  font-size: 0.68rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-family: "Inter", sans-serif;
  font-weight: 500;
}
.ticks span {
  position: absolute; top: 0;
  transform: translateX(-50%);
}
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }

/* date bar */
.dbar {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
  padding: 12px 14px;
  margin-bottom: 16px;
  background: var(--surface);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.dbar input[type=date] {
  font: inherit;
  color: var(--text);
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 9px 14px;
  outline: none;
  flex: 1 1 150px;
  min-width: 0;
  color-scheme: dark;
  font-size: 0.88rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.dbar input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(59,158,255,0.2);
}

/* cards — liquid glass */
.list { display: grid; gap: 12px; }
.card {
  background: var(--surface);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  cursor: pointer;
  opacity: 0;
  animation: rise 0.55s cubic-bezier(.2,.8,.2,1) forwards;
  transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.2s;
  border-radius: 3px 0 0 3px;
}
.card:hover {
  border-color: var(--border-hover);
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.28);
}
.card:hover::before {
  background: linear-gradient(to bottom, var(--blue), transparent);
}
.cicon {
  position: relative;
  width: 46px; height: 46px;
  border-radius: 14px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(59,158,255,0.18), rgba(59,158,255,0.05));
  border: 1px solid rgba(59,158,255,0.22);
}
.cicon svg { width: 24px; height: 24px; }
.cicon .dot {
  width: 14px; height: 14px;
  top: -2px; right: -2px;
  border-width: 2.5px;
}
.who {
  font-weight: 650;
  font-size: 1rem;
  letter-spacing: -0.01em;
}
.dept {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 2px;
}
.route-line {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 8px;
  padding: 8px 11px;
  background: rgba(0,0,0,0.22);
  border-radius: 12px;
  border: 1px solid var(--border);
  font-size: 0.82rem;
  line-height: 1.45;
}
.route-line .pin {
  flex: none;
  width: 18px; height: 18px;
  margin-top: 1px;
  color: var(--blue);
  opacity: 0.9;
}
.route-line .route-text {
  color: var(--text);
  word-break: break-word;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.chip {
  font-size: 0.74rem;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--muted);
  font-weight: 500;
}
.chip.time {
  background: rgba(59,158,255,0.1);
  border-color: rgba(59,158,255,0.25);
  color: #8ec8ff;
}
.chip.warn {
  background: rgba(255,77,94,0.12);
  border-color: rgba(255,77,94,0.35);
  color: #ff8a94;
}
.badge {
  font-size: 0.76rem;
  font-weight: 650;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}
.s-ok {
  color: var(--green);
  background: rgba(0,214,143,0.12);
  border-color: rgba(0,214,143,0.35);
}
.s-wait {
  color: var(--yellow);
  background: rgba(255,214,10,0.1);
  border-color: rgba(255,214,10,0.3);
}
.s-no {
  color: #ff8a94;
  background: rgba(255,77,94,0.1);
  border-color: rgba(255,77,94,0.3);
}
.s-na {
  color: var(--muted);
  background: rgba(255,255,255,0.04);
  border-color: var(--border);
}

.msg {
  background: var(--surface);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 36px 24px;
  text-align: center;
  box-shadow: 0 8px 28px rgba(0,0,0,0.2);
}
.msg h3 { margin-bottom: 8px; font-size: 1.1rem; }
.msg p {
  color: var(--muted);
  max-width: 480px;
  margin: 0 auto 14px;
  font-size: 0.92rem;
}
.skeleton {
  height: 92px;
  border-radius: var(--r);
  background: linear-gradient(105deg, rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 70%);
  background-size: 200% 100%;
  animation: sh 1.5s infinite;
  border: 1px solid var(--border);
}
@keyframes sh { to { background-position: -200% 0; } }

.modal {
  position: fixed; inset: 0;
  display: none;
  place-items: center;
  padding: 16px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 50;
}
.modal.open { display: grid; }
.sheet {
  width: min(540px, 100%);
  max-height: 84vh;
  overflow: auto;
  background: rgba(18, 22, 30, 0.92);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px;
  animation: pop 0.25s cubic-bezier(.2,.9,.3,1);
  box-shadow: 0 24px 60px rgba(0,0,0,0.45);
}
@keyframes pop {
  from { transform: translateY(16px) scale(0.96); opacity: 0; }
}
.sheet h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
.rows { margin-top: 16px; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}
.row span:first-child { color: var(--muted); flex: 0 0 38%; }
.row span:last-child { text-align: right; word-break: break-word; }

footer {
  margin-top: 40px;
  text-align: center;
